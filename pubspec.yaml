name: bill_compliance_scanner
description: Scans a printed restaurant bill and flags illegal overcharges against Indian consumer-protection law.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # Camera capture and on-device OCR.
  camera: ^0.11.0
  google_mlkit_text_recognition: ^0.15.0
  image_picker: ^1.1.2

  # State management.
  provider: ^6.1.2

  # Local scan history.
  sqflite: ^2.3.3
  path_provider: ^2.1.4
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
